<!doctype html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>HaraQR</title>

    <meta name="description" content="Link and QR Code Generator." />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="public/flowbite.min.css" type="text/css" />

    <link rel="stylesheet" href="public/styles.css" type="text/css" />
  </head>

  <body>
    <!--[if lt IE 7]>
      <p class="browsehappy">
        You are using an <strong>outdated</strong> browser. Please
        <a href="#">upgrade your browser</a> to improve your experience.
      </p>
    <![endif]-->

    <main>
      <div class="mb-4 border-b border-default">
        <ul
          class="flex flex-wrap -mb-px text-sm font-medium text-center"
          id="default-tab"
          data-tabs-toggle="#default-tab-content"
          role="tablist"
        >
          <li class="me-2" role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base"
              id="qr-tab"
              data-tabs-target="#qr"
              type="button"
              role="tab"
              aria-controls="qr"
              aria-selected="false"
            >
              QR Code
            </button>
          </li>
          <li class="me-2" role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base hover:text-fg-brand hover:border-brand"
              id="email-tab"
              data-tabs-target="#email"
              type="button"
              role="tab"
              aria-controls="email"
              aria-selected="false"
            >
              Email
            </button>
          </li>
          <li class="me-2" role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base hover:text-fg-brand hover:border-brand"
              id="social-tab"
              data-tabs-target="#social"
              type="button"
              role="tab"
              aria-controls="social"
              aria-selected="false"
            >
              Social
            </button>
          </li>
          <li role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base hover:text-fg-brand hover:border-brand"
              id="help-tab"
              data-tabs-target="#help"
              type="button"
              role="tab"
              aria-controls="help"
              aria-selected="false"
            >
              Help
            </button>
          </li>
          <li role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base hover:text-fg-brand hover:border-brand"
              id="privacy-tab"
              data-tabs-target="#privacy"
              type="button"
              role="tab"
              aria-controls="privacy"
              aria-selected="false"
            >
              Privacy
            </button>
          </li>
          <li role="presentation">
            <button
              class="inline-block p-4 border-b-2 rounded-t-base hover:text-fg-brand hover:border-brand"
              id="about-tab"
              data-tabs-target="#about"
              type="button"
              role="tab"
              aria-controls="about"
              aria-selected="false"
            >
              About
            </button>
          </li>
        </ul>
      </div>
      <div id="default-tab-content">
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="qr"
          role="tabpanel"
          aria-labelledby="qr-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/qr.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="email"
          role="tabpanel"
          aria-labelledby="email-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/email.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="social"
          role="tabpanel"
          aria-labelledby="social-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/social.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="help"
          role="tabpanel"
          aria-labelledby="help-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/help.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="privacy"
          role="tabpanel"
          aria-labelledby="privacy-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/privacy.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
        <div
          class="hidden p-4 rounded-base bg-neutral-secondary-soft"
          id="about"
          role="tabpanel"
          aria-labelledby="about-tab"
        >
          <!-- Embed Element Alternative -->
          <embed
            src="scripts/about.html"
            type="text/html"
            width="100%"
            height="750px"
          />
        </div>
      </div>
    </main>

    <script src="public/flowbite.min.js" type="text/javascript"></script>
    <script src="public/scripts.js" type="text/javascript"></script>
  </body>
</html>
