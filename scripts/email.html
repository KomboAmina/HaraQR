<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

 <!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>
<script src="../public/uikit/js/uikit-icons.min.js"></script>

<section class="uk-padding">

    <form method="get" class="uk-grid">

        <div class="uk-width-1-2">

            <div class="uk-padding">
              <h2>1. Draft your Email</h2>
              <p class="uk-body-text">Enter the details for the mailto URL.</p>

              <div class="uk-margin">

                <label for="txt-subject" class="uk-form-label">Subject</label>

                <input type="text" name="txt-subject" id="txt-subject" class="uk-input" placeholder="eg I found this new browser extension" value="New Browser Extension"
                onkeyup="initMailtoGenerator();"/>

              </div>

              <div class="uk-margin">

                <label for="txt-recipient" class="uk-form-label">Recipient</label>

                <input type="email" name="txt-recipient" id="txt-recipient" class="uk-input" placeholder="eg mtu@person.ke" value="info@example.com" onkeyup="initMailtoGenerator();"/>

              </div>

              <div class="uk-margin">

                <label for="txt-cc" class="uk-form-label">Cc</label>

                <input type="email" name="txt-cc" id="txt-cc" class="uk-input" placeholder="eg mtu@person.ke" value="info@example.com" onkeyup="initMailtoGenerator();"/>

              </div>

              <div class="uk-margin">

                <label for="txt-bcc" class="uk-form-label">Bcc</label>

                <input type="email" name="txt-cc" id="txt-bcc" class="uk-input" placeholder="eg mtu@person.ke" value="info@example.com" onkeyup="initMailtoGenerator();"/>

              </div>

              <div class="uk-margin">

                <label for="txt-body" class="uk-form-label">Message Body</label>

                <textarea name="txt-body" id="txt-body" class="uk-textarea" placeholder="your message body" rows="8" onkeyup="initMailtoGenerator();">I found a new browser extension that makes my work so much easier.</textarea>

              </div>

              <div class="uk-margin uk-text-right">

                <button class="uk-button uk-button-primary" type="clear">Clear</button>

              </div>

            </div>

        </div>

         <div class="uk-width-1-2">

            <div class="uk-padding">
              <h2>2. View your new link</h2>
              <p class="uk-body-text">Test your generated link by clicking it.</p>

              <div class="uk-margin uk-text-bold" id="dv-output"></div>

              <div class="uk-text-bold uk-hidden" id="dv-copy"></div>

              <h2>3. Use the result</h2>
              <p class="uk-body-text">Copy the link, download the QR code.</p>

              <ul class="uk-accordion-default" uk-accordion>
                <li>
                  <a href="#" class="uk-accordion-title" onclick="initCopyToClipboard();"><span uk-icon="icon: copy"></span> Copy Link to Clipboard</a>
                </li>
                <li>
                    <a class="uk-accordion-title" href><span uk-icon="icon: image"></span> QR Code<span uk-accordion-icon></a>
                    <div class="uk-accordion-content">
                        <p>Download JPEG file.</p>

                        <div id="qr-output"></div>

                        <div id="qr-output-label" class="uk-hidden"></div>
                    </div>
                </li>
            </ul>

            </div>

        </div>

    </form>

</section>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">

  initMailtoGenerator();

  function initMailtoGenerator(){

      var subject = document.getElementById("txt-subject").value;

      var recipient = document.getElementById("txt-recipient").value;

      var cc = document.getElementById("txt-cc").value;

      var bcc = document.getElementById("txt-bcc").value;

      var body = document.getElementById("txt-body").value;

      var mailink = "mailto:"+recipient+"&subject="+encodeURI(subject)+"&cc="+cc+"&bcc="+bcc+"body="+encodeURI(body);

      document.getElementById("dv-copy").innerHTML = mailink;

      var outputinner = "<p><a href='" + mailink + "' target='_blank' class='uk-button uk-button-secondary uk-button-large uk-width-1-1'><span uk-icon='mail'></span> Generated Link</a></p><div class='uk-text-block'><p>" + mailink + "</p></div>";

      document.getElementById("dv-output").innerHTML = outputinner;

      generateQRCode(mailink, "qr-output", "qr-output-label");

  }

  function initCopyToClipboard(){

    var content = document.getElementById("dv-copy").innerHTML;

    copyToClipboard(content);

  }

</script>
