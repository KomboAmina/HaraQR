<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<section>
  <form method="get" class="uk-grid">
    <div class="uk-width-2-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div uk-grid>
          <div class="uk-width-1-3">
            <div class="uk-margin">
              <label for="txt-recipient" class="uk-form-label">Recipient</label>

              <input
                type="email"
                name="txt-recipient"
                id="txt-recipient"
                class="uk-input"
                placeholder="eg mtu@person.ke"
                value="info@example.com"
                onkeyup="initMailtoGenerator()"
              />
            </div>

            <div class="uk-margin">
              <label for="txt-cc" class="uk-form-label">Cc</label>

              <input
                type="email"
                name="txt-cc"
                id="txt-cc"
                class="uk-input"
                placeholder="eg mtu@person.ke"
                value="info@example.com"
                onkeyup="initMailtoGenerator()"
              />
            </div>

            <div class="uk-margin">
              <label for="txt-bcc" class="uk-form-label">Bcc</label>

              <input
                type="email"
                name="txt-cc"
                id="txt-bcc"
                class="uk-input"
                placeholder="eg mtu@person.ke"
                value="info@example.com"
                onkeyup="initMailtoGenerator()"
              />
            </div>
          </div>
          <div class="uk-width-2-3">
            <div class="uk-margin">
              <label for="txt-subject" class="uk-form-label">Subject</label>

              <input
                type="text"
                name="txt-subject"
                id="txt-subject"
                class="uk-input"
                placeholder="eg I found this new browser extension"
                value="Generate an Email Link"
                onkeyup="initMailtoGenerator()"
              />
            </div>

            <div class="uk-margin">
              <label for="txt-body" class="uk-form-label">Message Body</label>

              <textarea
                name="txt-body"
                id="txt-body"
                class="uk-textarea"
                placeholder="your message body"
                rows="8"
                onkeyup="initMailtoGenerator()"
              >
Use this form to generate an email message link. Check the preview: everything works as you type.</textarea
              >
            </div>
          </div>
        </div>

        <div class="uk-margin uk-text-right">
          <button class="uk-button uk-button-primary" type="clear">
            Clear
          </button>
        </div>
      </div>
    </div>

    <div class="uk-width-1-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div class="uk-card-title">Preview</div>

        <div
          class="uk-margin uk-text-bold uk-text-block"
          id="dv-email-output"
        ></div>

        <a href="#" id="btn-email-test" target="_blank" class="uk-text-bold"
          >Test</a
        >
        |
        <a
          href="#"
          class="uk-text-bold"
          id="btn-email-copy"
          data-val=""
          onclick="initCopyToClipboard()"
          >Copy to Clipboard</a
        >
      </div>
    </div>
  </form>
</section>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  initMailtoGenerator();

  function initMailtoGenerator() {
    var subject = document.getElementById("txt-subject").value;

    var recipient = document.getElementById("txt-recipient").value;

    var cc = document.getElementById("txt-cc").value;

    var bcc = document.getElementById("txt-bcc").value;

    var body = document.getElementById("txt-body").value;

    var mailink =
      "mailto:" +
      recipient +
      "&subject=" +
      encodeURI(subject) +
      "&cc=" +
      cc +
      "&bcc=" +
      bcc +
      "body=" +
      encodeURI(body);

    document.getElementById("dv-email-output").innerHTML = mailink;

    document.getElementById("btn-email-test").setAttribute("href", mailink);

    document.getElementById("btn-email-copy").setAttribute("data-val", mailink);
  }

  function initCopyToClipboard() {
    var content = document
      .getElementById("btn-email-copy")
      .getAttribute("data-val");

    copyToClipboard(content);
  }
</script>
