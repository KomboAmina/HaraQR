<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">
  <div class="uk-padding">
    <ul class="uk-accordion-default" uk-accordion>
      <li id="acc-fb">
        <a class="uk-accordion-title" href onclick="generateFBShareLink()"
          ><i uk-icon="icon:facebook"></i> Facebook Share</a
        >
        <div class="uk-accordion-content">
          <div uk-grid>
            <div class="uk-width-1-2">
              <div class="uk-card uk-card-default uk-card-body">
                <div class="uk-margin">
                  <label for="txt-fb-url" class="uk-form-label"
                    >URL to Share</label
                  >

                  <input
                    type="url"
                    name="txt-fb-url"
                    id="txt-fb-url"
                    class="uk-input"
                    placeholder="https://www.example.com"
                    value="https://www.example.com"
                    onkeyup="generateFBShareLink()"
                  />
                </div>
                <div class="uk-margin uk-text-right">
                  <button type="clear" class="uk-button uk-button-primary">
                    Clear
                  </button>
                </div>
              </div>
            </div>
            <div class="uk-width-1-2">
              <div class="uk-card uk-card-default uk-card-body">
                <div class="uk-card-title uk-margin-bottom">Preview</div>

                <div class="uk-text-block uk-text-bold" id="dv-fb-output"></div>

                <a
                  href="#test"
                  target="_blank"
                  id="btn-fb-test"
                  class="uk-text-bold"
                  >Test</a
                >
                |
                <a
                  href="#copy"
                  id="btn-fb-copy"
                  onclick="initCopyButton('btn-fb-copy')"
                  data-val=""
                  class="uk-text-bold"
                  >Copy to Clipboard</a
                >
              </div>
            </div>
          </div>
        </div>
      </li>
      <li id="acc-mes">
        <a
          class="uk-accordion-title"
          href
          onclick="generateMessengerShareLink()"
          ><i uk-icon="icon:commenting"></i> Facebook Messenger</a
        >
        <div class="uk-accordion-content">
          <div uk-grid>
            <div class="uk-width-1-2">
              <div class="uk-card uk-card-default uk-card-body">
                <div class="uk-margin">
                  <label for="txt-mes-url" class="uk-form-label"
                    >URL to Share</label
                  >

                  <input
                    type="url"
                    name="txt-mes-url"
                    id="txt-mes-url"
                    class="uk-input"
                    placeholder="https://www.example.com"
                    value="https://www.example.com"
                    onkeyup="generateMessengerShareLink()"
                  />
                </div>
                <div class="uk-margin uk-text-right">
                  <button type="clear" class="uk-button uk-button-primary">
                    Clear
                  </button>
                </div>
              </div>
            </div>
            <div class="uk-width-1-2">
              <div class="uk-card uk-card-default uk-card-body">
                <div class="uk-card-title uk-margin-bottom">Preview</div>

                <div
                  class="uk-text-block uk-text-bold"
                  id="dv-mes-output"
                ></div>

                <a
                  href="#test"
                  target="_blank"
                  id="btn-mes-test"
                  class="uk-text-bold"
                  >Test</a
                >
                |
                <a
                  href="#copy"
                  id="btn-mes-copy"
                  onclick="initCopyButton('btn-mes-copy')"
                  data-val=""
                  class="uk-text-bold"
                  >Copy to Clipboard</a
                >
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  function generateFBShareLink() {
    var text = document.getElementById("txt-fb-url").value;

    var postlink =
      "https://www.facebook.com/sharer/sharer.php?u=" + encodeURI(text);

    document.getElementById("dv-fb-output").innerHTML =
      "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById("btn-fb-test").setAttribute("href", postlink);

    document.getElementById("btn-fb-copy").setAttribute("data-val", postlink);

    goToAnchor("acc-fb");
  }

  function generateMessengerShareLink() {
    var text = document.getElementById("txt-mes-url").value;

    var postlink = "fb-messenger://share?link=" + encodeURI(text);

    document.getElementById("dv-mes-output").innerHTML =
      "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById("btn-mes-test").setAttribute("href", postlink);

    document.getElementById("btn-mes-copy").setAttribute("data-val", postlink);

    goToAnchor("acc-fb");
  }

  function initCopyButton(buttonID) {
    copyToClipboard(document.getElementById(buttonID).getAttribute("data-val"));
  }
</script>
