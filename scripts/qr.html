<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>
<script src="../public/uikit/js/uikit-icons.min.js"></script>

<section>
  <div>
    <!--form-->
    <form method="get" class="uk-grid" uk-grid>
      <div class="uk-width-1-3@m uk-width-1-1@s">
        <div class="uk-card uk-card-default uk-card-body">
          <textarea
            name="txtinput"
            name="txtinput"
            id="txtinput"
            placeholder="enter text or URL"
            onkeyup="InitQRCode()"
            onchange="InitQRCode()"
            class="uk-textarea"
            rows="12"
            required
          >
Welcome to HaraQR. This is default QR code data.</textarea
          >

          <div class="uk-margin uk-text-right uk-text-bold">
            <p><span id="count-div"></span>/7089</p>
          </div>

          <div class="uk-margin uk-text-right">
            <button type="clear" class="uk-button uk-button-primary">
              Clear
            </button>
          </div>
        </div>
      </div>

      <div class="uk-width-1-3@m uk-width-1-1@s">
        <div class="uk-card uk-card-default uk-card-body">
          <p class="uk-text-body">
            Right-click and choose "Copy image" or "Save image as" to save the
            QR Code.
          </p>

          <section id="qr-output">code will appear here.</section>
        </div>
      </div>

      <div class="uk-width-1-3">
        <div class="uk-card uk-card-default uk-card-body">
          <div class="uk-card-title">Encoded Data</div>
          <section id="qr-label" class="uk-text-block uk-margin"></section>
        </div>
      </div>
    </form>
    <!--form-->
  </div>
</section>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  InitQRCode();

  function InitQRCode() {
    var qrcontent = document.getElementById("txtinput").value;

    var qrdiv = document.getElementById("qr-output");

    var verdict = true;

    var alert = "<ol>";

    if (qrcontent.length < 1) {
      verdict = false;
      alert = alert + "<li>Data is empty.</li>";
    }

    if (qrcontent.length > 7089) {
      verdict = false;
      alert = alert + "<li>Data cannot be longer than 7089 characters.</li>";
    }

    alert = alert + "</ol>";

    initCharacterCount();

    if (verdict) {
      generateQRCode(qrcontent, "qr-output", "qr-label", 384);
    } else {
      qrdiv.innerHTML =
        "<div class='uk-background-muted uk-padding'><h4>Cannot create preview:</h4>" +
        alert +
        "</div>";
    }
  }

  function initCharacterCount() {
    var qrcontent = document.getElementById("txtinput").value;

    displayCharacterCount(qrcontent, "count-div");
  }
</script>
