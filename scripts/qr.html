<link rel="stylesheet" href="../public/flowbite.min.css" type="text/css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<section class="bg-neutral-primary">
  <div class="py-8 px-4 mx-auto max-w-screen-2xl text-center lg:py-16">
    <h1
      class="mb-6 text-4xl font-bold tracking-tighter text-heading md:text-5xl lg:text-6xl"
    >
      Welcome to HaraQR
    </h1>
    <p class="mb-8 text-base font-normal text-body md:text-xl">
      Genere a QR code here. Copy it to your clipboard.
    </p>

    <!--form-->
    <form method="get" id="fmgenerateqr">
      <button
        type="clear"
        class="text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
        id="btn-clear"
      >
        Clear
      </button>
      <input
        type="text"
        name="txtinput"
        id="txtinput"
        placeholder="enter text or URL"
        onkeyup="generateQRCode()"
        class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
        required
      />
    </form>
    <!--form-->

    <div id="qr-label"></div>
    <section id="qr-output" class="format lg:format_lg">
      <p class="text-center text-body">output here</p>
    </section>

    (accordion here: copy to clipboard, download image: PNG, JPEG, SVG, WEBP)
  </div>
</section>

<script src="../public/flowbite.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script type="text/javascript">
  function generateQRCode() {
    var qrcontent = document.getElementById("txtinput").value;

    document.getElementById("qr-output").innerHTML = qrcontent + "";

    var qrdiv = document.getElementById("qr-output");

    qrdiv.innerHTML = "";

    if (qrcontent.length <= 1270) {
      document.getElementById("qr-label").innerHTML = qrcontent;

      var qrCode = new QRCode(qrdiv, {
        text: qrcontent /*
        colorDark: "#000000",
        colorLight: "#FFFFFF",*/,
        width: 256,
        height: 256,
      });
    } else {
      document.getElementById("qr-label").innerHTML =
        "qr code can only generated with less than 1271 characters.";
    }
  }
</script>
