<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

 <!-- UIkit JS -->
    <script src="../public/uikit/js/uikit.min.js"></script>
    <script src="../public/uikit/js/uikit-icons.min.js"></script>

<section class="bg-neutral-primary">

  <div class="uk-padding">

    <!--form-->
    <form method="get" class="uk-grid" uk-grid>

      <div class="uk-width-1-3">
        
        <div class="uk-margin">

          <h2>1. Enter input here.</h2>

          <textarea name="txtinput" name="txtinput" id="txtinput" placeholder="enter text or URL" onkeyup="InitQRCode()" class="uk-textarea uk-form-large" rows="12" required>Welcome to HaraQR</textarea>

          <div class="uk-margin uk-text-right uk-text-bold">
            <p><span id="count-div"></span>/7089</p>
          </div>
        
        </div>

         <div class="uk-margin uk-text-right">
          <button
            type="clear"
            class="uk-button uk-button-primary"
          >
            Clear
          </button>
        </div>
      </div>

      <div class="uk-width-1-3">
       <div class="uk-margin">

          <h2>2. View your output.</h2>

          <section id="qr-output">
            code will appear here.
          </section><hr />
          <div class="uk-margin">
          <p><section
            id="qr-label"
            class="uk-text-block"
          ></section></p>
        </div>
        </div>
      </div>

      <div class="uk-width-1-3">

          <div class="uk-margin">
            <h2>3. Use the image.</h2>
            <ul class="uk-accordion-default" uk-accordion>
                    <li>
                    <a class="uk-accordion-title" href="#copy" onclick="initCopyImage();"><span uk-icon="icon: copy"></span> Copy to Clipboard</a>
                    </li>
                <li>
                    <a class="uk-accordion-title" href><span uk-icon="icon: image"></span> Generate PNG <span uk-accordion-icon></a>
                    <div class="uk-accordion-content">
                        <p>Download PNG file.</p>
                    </div>
                </li>
                <li>
                    <a class="uk-accordion-title" href><span uk-icon="icon: image"></span> Generate JPEG <span uk-accordion-icon></a>
                    <div class="uk-accordion-content">
                        <p>Download JPEG file.</p>
                    </div>
                </li>
                <li>
                    <a class="uk-accordion-title" href><span uk-icon="icon: image"></span> Generate SVG <span uk-accordion-icon></a>
                    <div class="uk-accordion-content">
                        <p>Download SVG file.</p>
                    </div>
                </li>
            </ul>
          </div>

        </div>
    </form>
    <!--form-->
  </div>
</section>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">

  InitQRCode();

  function InitQRCode() {
    var qrcontent = document.getElementById("txtinput").value;

    var qrdiv = document.getElementById("qr-output");

    initCharacterCount();

    generateQRCode(qrcontent, "qr-output", "qr-label");

  }

  function initCopyImage(){

    var imageContent = document.getElementById("qr-output").innerHTML;

    copyToClipboard(imageContent);

  }

  function initCharacterCount(){

      var qrcontent = document.getElementById("txtinput").value;
    
      displayCharacterCount(qrcontent, "count-div");

  }

</script>
