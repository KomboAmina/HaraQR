<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">
  <div class="uk-padding">
    <div uk-grid>
      <div class="uk-width-1-3">
        <div class="uk-card uk-card-default uk-card-body">
          <div class="uk-margin">
            <label for="txt-telurl" class="uk-form-label"
              >Snapchat Username</label
            >

            <input
              type="text"
              name="txt-snapname"
              id="txt-snapname"
              class="uk-input"
              placeholder="eg mysnapname"
              onkeyup="createSnapchatLink()"
              required
              value="mysnapname"
            />
          </div>

          <div class="uk-margin uk-text-right">
            <button type="clear" class="uk-button uk-button-primary">
              Clear
            </button>
          </div>
        </div>
      </div>

      <div class="uk-width-2-3">
        <div class="uk-card uk-card-default uk-card-body">
          <div class="uk-card-title uk-margin-bottom">Preview</div>

          <div uk-grid>
            <div class="uk-width-1-2">
              <div class="uk-margin" id="dv-snapqr"></div>
            </div>

            <div class="uk-width-1-2">
              <div
                class="uk-text-block uk-text-bold uk-margin"
                id="dv-snaplabel"
              ></div>

              <div class="uk-hidden" id="dv-snapcopy"></div>

              <div class="uk-text-block uk-text-bold" id="dv-snaplink"></div>

              <p>
                <a
                  href="#"
                  id="btn-snapchat-test"
                  target="_blank"
                  class="uk-text-bold"
                  >Test</a
                >
                |
                <a
                  href="#"
                  class="uk-text-bold"
                  id="btn-snapchat-copy"
                  data-val=""
                  onclick="initCopyToClipboard()"
                  >Copy to Clipboard</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  createSnapchatLink();

  function createSnapchatLink() {
    var name = document.getElementById("txt-snapname").value;

    //www.snapchat.com/add/folio7

    var walink = "https://www.snapchat.com/add/" + name;

    generateQRCode(walink, "dv-snapqr", "dv-snaplabel", 360);

    document.getElementById("dv-snapcopy").innerHTML = walink;

    document.getElementById("btn-snapchat-test").setAttribute("href", walink);
  }

  function initCopyToClipboard() {
    var content = document.getElementById("dv-snapcopy").innerHTML;

    copyToClipboard(content);
  }
</script>
