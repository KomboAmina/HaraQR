<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

 <!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">

    <div class="uk-padding">

        <ul class="uk-accordion-default" uk-accordion>
            <li id="acc-post">
                <a class="uk-accordion-title" onclick="generatePostIntent()"><span uk-icon="icon: pencil"></span> Tweet/Post <span uk-accordion-icon></a>
                <div class="uk-accordion-content">

                    <div uk-grid>
                        <div class="uk-width-1-2">

                            <div class="uk-card uk-card-default uk-card-body">

                                <div class="uk-margin">

                        <label for="txt-post-post" class="uk-form-label">Message Text</label>

                        <textarea id="txt-post-post" name="txt-post-post" class="uk-textarea" rows="4" maxlength="280" onkeyup="generatePostIntent();" required>Generate a Post intent for Twitter/X. Test it with the preview. It happens automatically as you type. Try it.</textarea>

                    </div>

                    <div class="uk-margin">

                        <label for="txt-post-url" class="uk-form-label">URL to Share</label>

                        <input type="url" name="txt-post-url" id="txt-post-url" class="uk-input" placeholder="https://www.example.com" value="https://www.example.com" onkeyup="generatePostIntent();"/>

                    </div>

                    <div class="uk-margin">

                        <label for="txt-post-hashtag" class="uk-form-label">Hashtags</label>

                        <input type="text" name="txt-post-hashtag" id="txt-post-hashtag" class="uk-input" placeholder="comma-separated, without the # symbol" value="browserextension, haraqr, awesome, news" onkeyup="generatePostIntent();"/>

                    </div>

                    <div class="uk-margin">

                        <label for="txt-post-attribution" class="uk-form-label">Attribution</label>

                        <input type="text" name="txt-post-attribution" id="txt-post-attribution" class="uk-input" placeholder="username without the @" onkeyup="generatePostIntent();"/>

                    </div>

                    <div class="uk-margin uk-text-right">

                        <button type="clear" class="uk-button uk-button-primary">Clear</button>

                    </div>

                            </div>

                        </div>
                        <div class="uk-width-1-2">

                            <div class="uk-card uk-card-default uk-card-body">

                                <div class="uk-card-title uk-margin-bottom">Preview</div>

                        <div class="uk-text-block uk-text-bold"
                         id="dv-post-output"></div>

                        <a href="#test" target="_blank" id="btn-post-post-test" class="uk-text-bold">Test</a> | <a href="#copy" id="btn-post-post-copy" onclick="initCopyButton('btn-post-post-copy');" data-val="" class="uk-text-bold">Copy to Clipboard</a>                       

                    </div>

                        </div>
                    </div>

                </div>
            </li>
            <li id="acc-repost">
                <a class="uk-accordion-title" href onclick="generateRepostIntent()"><span uk-icon="icon: social"></span> Retweet/Repost <span uk-accordion-icon></a>
                <div class="uk-accordion-content">

                    <div class="uk-card uk-card-default uk-card-body">

                    <div class="uk-margin">

                        <label for="txt-repost-idurl" class="uk-form-label">Tweet/Post ID</label>

                        <input type="number" name="txt-repost-idurl" id="txt-repost-idurl" class="uk-input" placeholder="tweet/post URL or ID" value="2124027531028517045" onkeyup="generateRepostIntent();" required/>

                    </div>

                    <div class="uk-margin">

                        <div class="uk-text-block uk-text-bold" id="dv-repost-output"></div>

                        <a href="#test" target="_blank" id="btn-repost-test" class="uk-text-bold">Test</a> | <a href="#copy" id="btn-repost-copy" onclick="initCopyButton('btn-repost-copy');" data-val="" class="uk-text-bold">Copy to Clipboard</a>

                    </div>

                    <div class="uk-margin uk-text-right">

                        <button type="clear" class="uk-button uk-button-primary">Clear</button>

                    </div>

                    </div>

                </div>
            </li>
            <li id="acc-like">
                <a class="uk-accordion-title" href onclick="generateLikeIntent()"><span uk-icon="icon: heart"></span> Like <span uk-accordion-icon></a>
                <div class="uk-accordion-content">

                    <div class="uk-card uk-card-default uk-card-body">

                     <div class="uk-margin">

                        <label for="txt-like-idurl" class="uk-form-label">Tweet/Post ID</label>

                        <input type="number" name="txt-like-idurl" id="txt-like-idurl" class="uk-input" placeholder="tweet/post URL or ID" value="2124027531028517045" onkeyup="generateLikeIntent();" required/>

                    </div>

                    <div class="uk-margin">

                        <div class="uk-text-block uk-text-bold" id="dv-like-output"></div>

                        <a href="#test" target="_blank" id="btn-like-test" class="uk-text-bold">Test</a> | <a href="#copy" id="btn-like-copy" onclick="initCopyButton('btn-like-copy');" data-val="" class="uk-text-bold">Copy to Clipboard</a>

                    </div>

                    <div class="uk-margin uk-text-right">

                        <button type="clear" class="uk-button uk-button-primary">Clear</button>

                    </div>

                    </div>
                </div>
            </li>
            <li id="acc-follow">
                <a class="uk-accordion-title" href  onclick="generateFollowIntent()"><span uk-icon="icon: users"></span> Follow <span uk-accordion-icon></a>
                <div class="uk-accordion-content">
                    <div class="uk-card uk-card-default uk-card-body">
                       <div class="uk-margin">

                        <label for="txt-follow-idurl" class="uk-form-label">Username without the @</label>

                        <input type="text" name="txt-follow-idurl" id="txt-follow-idurl" class="uk-input" placeholder="eg WholesomeMeme" value="WholesomeMeme" onkeyup="generateFollowIntent();" required/>

                    </div>

                    <div class="uk-margin">

                        <div class="uk-text-block uk-text-bold" id="dv-follow-output"></div>

                        <a href="#test" target="_blank" id="btn-follow-test" class="uk-text-bold">Test</a> | <a href="#copy" id="btn-follow-copy" onclick="initCopyButton('btn-follow-copy');" data-val="" class="uk-text-bold">Copy to Clipboard</a>

                    </div>

                    <div class="uk-margin uk-text-right">

                        <button type="clear" class="uk-button uk-button-primary">Clear</button>

                    </div>

                    </div>
                </div>
            </li>
            <li id="acc-dm">
                <a class="uk-accordion-title" href onclick="generateDMIntent()"><span uk-icon="icon: comment"></span> DM <span uk-accordion-icon></a>
                <div class="uk-accordion-content">
                    <div uk-grid>

                        <div class="uk-width-1-2">
                            <div class="uk-card uk-card-default uk-card-body">
                                 <div class="uk-margin">

                                    <label for="txt-dm-idurl" class="uk-form-label">Username without the @</label>

                                    <input type="text" name="txt-dm-idurl" id="txt-dm-idurl" class="uk-input" placeholder="eg WholesomeMeme" value="WholesomeMeme" onkeyup="generateDMIntent();" required/>

                                </div>

                                <div class="uk-margin">
                                    <label for="txt-dm-body" class="uk-form-label">Message Body</label>

                                    <textarea
                                        name="txt-dm-body"
                                        id="txt-dm-body"
                                        class="uk-textarea"
                                        placeholder="your message body"
                                        rows="8"
                                        onkeyup="generateDMIntent()" required
                                    >This is your DM message. It will generate as you type. Try it.</textarea
                                    >
                                </div>

                                

                                <div class="uk-margin uk-text-right">

                                    <button type="clear" class="uk-button uk-button-primary">Clear</button>

                                </div>
                            </div>
                        </div>

                        <div class="uk-width-1-2">

                            <div class="uk-card uk-card-default uk-card-body">
                                <div class="uk-card-title">Preview</div>
                                <div class="uk-margin">

                                    <div class="uk-text-block uk-text-bold" id="dv-dm-output"></div>

                                    <a href="#test" target="_blank" id="btn-dm-test" class="uk-text-bold">Test</a> | <a href="#copy" id="btn-dm-copy" onclick="initCopyButton('btn-dm-copy');" data-val="" class="uk-text-bold">Copy to Clipboard</a>

                                </div>
                            </div>

                        </div>

                    </div>
                   
                </div>
            </li>
        </ul>

    </div>

</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">

function generatePostIntent(){

    var text = document.getElementById("txt-post-post").value;

    document.getElementById("dv-post-output").innerHTML = text;

    var hashtag = document.getElementById("txt-post-hashtag").value;

    var attribution = document.getElementById("txt-post-attribution").value;

    var postlink = "https://www.x.com/intent/tweet?text="+encodeURI(text)+"&hashtags="+encodeURI(hashtag)+"&via="+attribution;

    document.getElementById("dv-post-output").innerHTML = "<p>"+postlink+"</p>";

    document.getElementById('btn-post-post-test').setAttribute('href',postlink);

    document.getElementById('btn-post-post-copy').setAttribute('data-val',postlink);

    goToAnchor("acc-post");

}

function generateRepostIntent(){

    var text = document.getElementById("txt-repost-idurl").value;

    var postlink = "https://www.x.com/intent/retweet?tweet_id="+text;

    document.getElementById("dv-repost-output").innerHTML = "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById('btn-repost-test').setAttribute('href',postlink);

    document.getElementById('btn-repost-copy').setAttribute('data-val',postlink);

    goToAnchor("acc-post");

}

function generateLikeIntent(){

    var text = document.getElementById("txt-like-idurl").value;

    var postlink = "https://www.x.com/intent/like?tweet_id="+text;

    document.getElementById("dv-like-output").innerHTML = "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById('btn-like-test').setAttribute('href',postlink);

    document.getElementById('btn-like-copy').setAttribute('data-val',postlink);

    goToAnchor("acc-repost");

}

function generateFollowIntent(){

    var text = document.getElementById("txt-follow-idurl").value;

    var postlink = "https://www.x.com/intent/follow?screen_name="+text;

    document.getElementById("dv-follow-output").innerHTML = "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById('btn-follow-test').setAttribute('href',postlink);

    document.getElementById('btn-follow-copy').setAttribute('data-val',postlink);

    goToAnchor("acc-like");

}

function generateDMIntent(){

    var text = document.getElementById("txt-dm-idurl").value;

    var message = document.getElementById("txt-dm-body").value;

    var postlink = "https://x.com/messages/compose?recipient_id="+text+"&text="+encodeURI(message);

    document.getElementById("dv-dm-output").innerHTML = "<p>" + encodeURI(postlink) + "</p>";

    document.getElementById('btn-dm-test').setAttribute('href',postlink);

    document.getElementById('btn-dm-copy').setAttribute('data-val',postlink);

    goToAnchor("acc-follow");

}

function initCopyButton(buttonID){

    copyToClipboard(document.getElementById(buttonID).getAttribute('data-val'));

}

</script>
