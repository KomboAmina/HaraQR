<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">
  <div uk-grid>
    <div class="uk-width-1-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div class="uk-margin">
          <label for="txt-wename" class="uk-form-label">Username</label>

          <input
            type="text"
            name="txt-wename"
            id="txt-wename"
            class="uk-input"
            placeholder="Your WeChat username"
            onkeyup="createWeChatLink()"
            required
            value="myname"
          />
        </div>

        <div class="uk-margin uk-text-right">
          <button type="clear" class="uk-button uk-button-primary">
            Clear
          </button>
        </div>
      </div>
    </div>

    <div class="uk-width-2-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div class="uk-card-title uk-margin-bottom">Preview</div>

        <div uk-grid>
          <div class="uk-width-1-2">
            <div class="uk-margin" id="dv-weqr"></div>
          </div>

          <div class="uk-width-1-2">
            <div
              class="uk-text-block uk-text-bold uk-margin"
              id="dv-welabel"
            ></div>

            <div class="uk-hidden" id="dv-wecopy"></div>

            <div class="uk-text-block uk-text-bold" id="dv-welink"></div>

            <p>
              <a
                href="#"
                id="btn-wechat-test"
                target="_blank"
                class="uk-text-bold"
                >Test</a
              >
              |
              <a
                href="#"
                class="uk-text-bold"
                id="btn-wechat-copy"
                data-val=""
                onclick="initCopyToClipboard()"
                >Copy to Clipboard</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  //https://weixin.qq.com/r/folio7

  createWeChatLink();

  function createWeChatLink() {
    var username = document.getElementById("txt-wename").value;

    var walink = "https://weixin.qq.com/r/" + username;

    generateQRCode(walink, "dv-weqr", "dv-welabel", 360);

    document.getElementById("dv-wecopy").innerHTML = walink;

    document.getElementById("btn-wechat-test").setAttribute("href", walink);
  }

  function initCopyButton(buttonID) {
    copyToClipboard(document.getElementById(buttonID).getAttribute("data-val"));
  }
</script>
