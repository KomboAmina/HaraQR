<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

<!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">
  <div uk-grid>
    <div class="uk-width-1-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div class="uk-margin">
          <label for="txt-number" class="uk-form-label">Phone Number</label>

          <input
            type="text"
            name="txt-number"
            id="txt-number"
            class="uk-input"
            placeholder="Include the country code eg +254"
            onkeyup="createWhatsAppLink()"
            required
            value="+254123456789"
          />
        </div>

        <div class="uk-margin">
          <label for="txt-body" class="uk-form-label">Message Body</label>

          <textarea
            name="txt-body"
            id="txt-body"
            class="uk-textarea"
            placeholder="your message body"
            rows="8"
            onkeyup="createWhatsAppLink()"
          >
Generate a WhatsApp chat link with this form. Use the preview to test your output. It happens as you type. Try it.</textarea
          >
        </div>

        <div class="uk-margin uk-text-right">
          <button type="clear" class="uk-button uk-button-primary">
            Clear
          </button>
        </div>
      </div>
    </div>
    <div class="uk-width-2-3">
      <div class="uk-card uk-card-default uk-card-body">
        <div>
          <div class="uk-card-title uk-margin-bottom">Preview</div>

          <div uk-grid>
            <div class="uk-width-1-2">
              <div class="uk-margin" id="dv-qr"></div>
            </div>

            <div class="uk-width-1-2">
              <div
                class="uk-text-block uk-text-bold uk-margin"
                id="dv-label"
              ></div>

              <div class="uk-hidden" id="dv-copy"></div>

              <div class="uk-text-block uk-text-bold" id="dv-link"></div>

              <p>
                <a
                  href="#"
                  id="btn-whatsapp-test"
                  target="_blank"
                  class="uk-text-bold"
                  >Test</a
                >
                |
                <a
                  href="#"
                  class="uk-text-bold"
                  id="btn-email-copy"
                  data-val=""
                  onclick="initCopyToClipboard()"
                  >Copy to Clipboard</a
                >
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">
  createWhatsAppLink();

  function createWhatsAppLink() {
    var number = document.getElementById("txt-number").value;

    var alert = "<ol>";

    var verdict = true;

    var body = document.getElementById("txt-body").value;

    if (number.length > 0 && number[0] == "+") {
      number = number.slice(1);
    }

    if (number.length < 1) {
      verdict = false;

      alert = alert + "<li>Phone number is required.</li>";
    }

    if (number.length > 15) {
      verdict = false;

      alert =
        alert + "<li>Phone number must be less than 15 characters long.</li>";
    }

    if (body.length < 1) {
      verdict = false;

      alert = alert + "<li>Message is required.</li>";
    }

    alert = alert + "</ol>";

    if (verdict) {
      var walink = "https://wa.me/" + number + "/" + encodeURI(body);

      generateQRCode(walink, "dv-qr", "dv-label", 360);
    } else {
      var walink =
        "<div class='uk-padding uk-background-muted'><h4>Cannot create preview:</h4>" +
        alert +
        "</div>";
      document.getElementById("dv-qr").innerHTML = walink;
    }

    document.getElementById("dv-copy").innerHTML = walink;

    document.getElementById("btn-whatsapp-test").setAttribute("href", walink);
  }

  function initCopyToClipboard() {
    var content = document.getElementById("dv-copy").innerHTML;

    copyToClipboard(content);
  }
</script>
