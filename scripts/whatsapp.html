<!-- UIkit CSS -->
<link rel="stylesheet" href="../public/uikit/css/uikit.min.css" />

<link rel="stylesheet" href="../public/styles.css" type="text/css" />

 <!-- UIkit JS -->
<script src="../public/uikit/js/uikit.min.js"></script>

<script src="../public/uikit/js/uikit-icons.min.js"></script>

<form method="get">

    <div class="uk-margin">

        <h3>1. Provide details</h3>

    </div>

    <div class="uk-margin">

        <label for="txt-number" class="uk-form-label">Phone Number</label>

        <input type="text" name="txt-number" id="txt-number"
         class="uk-input" placeholder="Include the country code eg +254" onkeyup="createWhatsAppLink();" required value="+254123456789"/>

    </div>

    <div class="uk-margin">

        <label for="txt-body" class="uk-form-label">Message Body</label>

        <textarea name="txt-body" id="txt-body" class="uk-textarea"
        placeholder="your message body"
        rows="4" onkeyup="createWhatsAppLink();">I found a new browser extension that makes my work so much easier.</textarea>

    </div>

    <div class="uk-margin">

        <h3>2. Test result</h3>

        <div class="uk-padding" id="dv-qr"></div>

        <div class="uk-text-block uk-text-bold" id="dv-label"></div>

        <div class="uk-hidden" id="dv-copy"></div>

        <div class="uk-text-block uk-text-bold" id="dv-link"></div>

    </div>

    <div class="uk-margin">

        <h3>3. Use the result</h3>

        copy to clipboard. save the QR code.

        <ul class="uk-accordion-default" uk-accordion>
            <li>
                <a href="#" class="uk-accordion-title" onclick="initCopyToClipboard();"><span uk-icon="icon: copy"></span> Copy Link to Clipboard</a>
            </li>
        </ul>

    </div>

</form>

<script src="../public/qrcodejs/jquery.min.js" type="text/javascript"></script>

<script src="../public/qrcodejs/qrcode.min.js" type="text/javascript"></script>

<script src="../public/scripts.js" type="text/javascript"></script>

<script type="text/javascript">

    createWhatsAppLink();

    function createWhatsAppLink(){

        var number = document.getElementById("txt-number").value;

        var body = document.getElementById("txt-body").value;

        if(number.length > 0 && number[0] == "+"){

            number = number.slice(1);

        }

        var walink = "https://wa.me/"+number+"/"+encodeURI(body);

        generateQRCode(walink, "dv-qr", "dv-label");

        document.getElementById("dv-copy").innerHTML = walink;

    }

    function initCopyToClipboard(){

        var content = document.getElementById("dv-copy").innerHTML;

        copyToClipboard(content);

    }

</script>
